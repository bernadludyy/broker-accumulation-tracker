name: Diagnose TRUE history dates

on:
  push:
    branches: ["diagnose/bot1-ai-true-history"]
    paths: [".github/workflows/diagnose_true_history.yml"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements_github.txt
      - name: Compare safe date coverage only
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date
          import os
          import psycopg
          import requests

          def report(label, values):
              dates = sorted({date.fromisoformat(str(x)[:10]) for x in values})
              gaps = [
                  (dates[i - 1].isoformat(), dates[i].isoformat(),
                   (dates[i] - dates[i - 1]).days)
                  for i in range(1, len(dates))
                  if (dates[i] - dates[i - 1]).days > 7
              ]
              print(label, {
                  "count": len(dates),
                  "first": dates[0].isoformat() if dates else None,
                  "last": dates[-1].isoformat() if dates else None,
                  "gaps_gt_7": gaps,
              })

          with psycopg.connect(os.environ["PROJECT_FABRIC_DATABASE_URL"], connect_timeout=6) as cn:
              with cn.cursor() as cur:
                  cur.execute("SET TRANSACTION READ ONLY")
                  cur.execute("""
                      SELECT trade_date FROM project_fabric.stock_history_daily
                      WHERE ticker='TRUE' ORDER BY trade_date DESC LIMIT 120
                  """)
                  report("NEON_HISTORY", [r[0] for r in cur.fetchall()])
                  cur.execute("""
                      SELECT trade_date FROM project_fabric.stock_summary_daily
                      WHERE ticker='TRUE' ORDER BY trade_date DESC LIMIT 120
                  """)
                  report("NEON_SUMMARY", [r[0] for r in cur.fetchall()])

          response = requests.get(
              "https://api.zapi.ink/v1/finance:idx/stock-history",
              headers={"x-api-key": os.environ["ZPI_API_KEY"], "accept": "application/json"},
              params={"code": "TRUE", "length": 120},
              timeout=30,
          )
          print("ZAPI_HTTP", response.status_code)
          response.raise_for_status()
          payload = response.json()
          for _ in range(5):
              if isinstance(payload, dict) and isinstance(payload.get("items"), list):
                  break
              if isinstance(payload, dict) and isinstance(payload.get("data"), (dict, list)):
                  payload = payload["data"]
                  continue
              break
          items = payload.get("items", []) if isinstance(payload, dict) else []
          report("ZAPI_HISTORY", [
              row.get("date") or row.get("Date")
              for row in items if isinstance(row, dict) and (row.get("date") or row.get("Date"))
          ])
          PY
