name: Bot1 AI Telegram Smoke (0 AI / 0 ZAPI)

# Runs automatically only for specifically titled approved merge commits.
on:
  push:
    branches: [main]
    paths:
      - "ai_decision_engine/**"
      - "broker_ytd_dispatch.py"
      - ".github/workflows/bot1_ai_telegram_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-bot-db
  cancel-in-progress: false

jobs:
  telegram-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'deploy(bot1-ai):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PATH: broker_tracker.db
      BOT1_AI_ENABLED: "0"
      BOT1_AI_REMOTE: "0"
      OPENAI_API_KEY: ""
      ZPI_API_KEY: ""
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_github.txt

      - run: python -m pip install -r requirements_github.txt

      - name: Verify required runtime configuration (without displaying secrets)
        shell: bash
        run: |
          test -n "$PROJECT_FABRIC_DATABASE_URL" || { echo "Missing Neon DB secret"; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing Telegram token"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing authorized private chat ID"; exit 1; }

      - name: Send AI STATUS to owner private chat
        run: python broker_ytd_dispatch.py --text "AI STATUS"

      - name: Send cache-only AI CHECK BBRI to owner private chat
        run: python broker_ytd_dispatch.py --text "AI CHECK BBRI"

      - name: Verify no AI paid mode was requested
        run: |
          test "$BOT1_AI_ENABLED" = "0"
          test "$BOT1_AI_REMOTE" = "0"
          echo "Smoke complete; 0 paid model requests and 0 ZAPI calls."
