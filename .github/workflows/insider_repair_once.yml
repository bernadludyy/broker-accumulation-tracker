name: BOT1 Insider Cache Repair Once v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/insider_repair_once.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      PROJECT_FABRIC_CACHE_NAMESPACE: shared-v1
      PROJECT_FABRIC_DB_REQUIRED: "true"
      ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PATH: broker_tracker.db
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_github.txt
      - run: pip install -r requirements_github.txt
      - name: Reparse BBRI and send corrected command output
        run: python broker_ytd_dispatch.py --text "INSIDER REFRESH BBRI"
