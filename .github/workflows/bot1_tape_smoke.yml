name: Bot1 Tape Telegram verification

on:
  push:
    branches: [main]
    paths:
      - 'orderflow_tape*.py'
      - 'scripts/tape_smoke.py'
      - '.github/workflows/bot1_tape_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-bot-db
  cancel-in-progress: false

jobs:
  telegram-smoke:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'deploy(bot1-tape):')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      PROJECT_FABRIC_CACHE_NAMESPACE: shared-v1
      PROJECT_FABRIC_DB_REQUIRED: 'true'
      ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PATH: broker_tracker.db
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_github.txt
      - run: pip install -r requirements_github.txt
      - run: python -m scripts.tape_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot1-tape-verification
          path: .runtime/tape-verification/
          retention-days: 7
