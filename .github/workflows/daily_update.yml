name: Daily Broker Update

on:
  schedule:
    - cron: "0 18 * * 1-5"
      timezone: "Asia/Jakarta"
    - cron: "0 19 * * 1-5"
      timezone: "Asia/Jakarta"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: broker-bot-db
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      PROJECT_FABRIC_CACHE_NAMESPACE: shared-v1
      PROJECT_FABRIC_DB_REQUIRED: "true"
      ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PATH: broker_tracker.db
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: pip install -r requirements_github.txt

      - name: Validate SQLite and decide retry work
        id: retry_gate
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import sqlite3
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import tracker

          db_path = Path(os.environ.get("DB_PATH", "broker_tracker.db"))
          if not db_path.exists():
              raise SystemExit(f"Database tidak ditemukan: {db_path}")

          with sqlite3.connect(db_path) as con:
              quick_check = con.execute("PRAGMA quick_check").fetchone()
              if not quick_check or quick_check[0] != "ok":
                  raise SystemExit(
                      f"SQLite quick_check gagal: {quick_check}"
                  )
              con.execute(
                  "SELECT 1 FROM broker_daily LIMIT 1"
              ).fetchone()

          schedule = os.environ.get("SCHEDULE_EXPRESSION", "")
          is_retry = schedule == "0 19 * * 1-5"
          should_run = True
          stale: list[str] = []
          target_date = tracker.get_safe_end_date(
              datetime.now(ZoneInfo("Asia/Jakarta")).date().isoformat()
          )

          if is_retry:
              watchlist = [
                  line.strip().upper()
                  for line in Path("watchlist.txt").read_text(
                      encoding="utf-8"
                  ).splitlines()
                  if line.strip()
                  and not line.strip().startswith("#")
              ]
              if not watchlist:
                  raise SystemExit("watchlist.txt kosong.")

              placeholders = ",".join("?" for _ in watchlist)
              with sqlite3.connect(db_path) as con:
                  rows = con.execute(
                      f"""
                      SELECT ticker, MAX(trade_date)
                      FROM broker_daily
                      WHERE ticker IN ({placeholders})
                      GROUP BY ticker
                      """,
                      watchlist,
                  ).fetchall()

              latest = {
                  str(ticker).upper(): str(last_date)
                  for ticker, last_date in rows
                  if last_date
              }
              stale = [
                  ticker
                  for ticker in watchlist
                  if latest.get(ticker) != target_date
              ]
              should_run = bool(stale)

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(
                  f"should_run={'true' if should_run else 'false'}\n"
              )
              fh.write(f"target_date={target_date}\n")
              fh.write(f"stale_count={len(stale)}\n")

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as fh:
              fh.write("## Daily broker refresh gate\n\n")
              fh.write(f"- Target date: {target_date}\n")
              fh.write(
                  f"- Mode: {'19:00 retry' if is_retry else '18:00 primary/manual'}\n"
              )
              if is_retry and stale:
                  preview = ", ".join(stale[:30])
                  suffix = " …" if len(stale) > 30 else ""
                  fh.write(
                      f"- Retry diperlukan untuk {len(stale)} ticker: "
                      f"{preview}{suffix}\n"
                  )
              elif is_retry:
                  fh.write(
                      "- Semua ticker sudah fresh; daily runner dilewati.\n"
                  )
              else:
                  fh.write("- Primary refresh dijalankan.\n")
          PY

      - name: Project Fabric preflight
        run: python -m project_fabric.selfcheck

      - name: Shared cache backend status
        run: python -m project_fabric.db_admin status --require

      - name: Phase 4 run start
        run: python -m project_fabric.observability run-start --service broker-accumulation-tracker --require

      - name: Phase 4 database health
        run: python -m project_fabric.observability health --service broker-accumulation-tracker --component shared_database --status ok --require

      - name: Restore Project Fabric cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/project_fabric/cache
          key: fabric-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            fabric-cache-${{ github.ref_name }}-

      - name: Run existing daily runner
        if: steps.retry_gate.outputs.should_run == 'true'
        run: python daily_runner.py

      - name: Record no-op retry
        if: steps.retry_gate.outputs.should_run == 'false'
        run: |
          echo "Retry 19:00 dilewati: database sudah fresh sampai ${{ steps.retry_gate.outputs.target_date }}."

      - name: Project Fabric API usage report
        if: always()
        run: python -m project_fabric.report --github-summary

      - name: Save Project Fabric cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime/project_fabric/cache
          key: fabric-cache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Project Fabric usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-fabric-usage-${{ github.run_id }}
          path: .runtime/project_fabric/api_usage.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Flush SQLite WAL
        if: always()
        run: python checkpoint_db.py

      - name: Persist daily database changes
        if: always()
        shell: bash
        run: |
          git config user.name "broker-bot-actions"
          git config user.email "broker-bot-actions@users.noreply.github.com"

          if [ -f broker_tracker.db ]; then
            git add -f broker_tracker.db
          fi

          git add watchlist.txt telegram_watchlist.txt .last_sent_safe_end_date 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No persistent data changes."
            exit 0
          fi

          git commit -m "bot: daily broker update [skip ci]"
          git push

      - name: Phase 4 run finish
        if: always()
        env:
          FABRIC_JOB_STATUS: ${{ job.status }}
        run: python -m project_fabric.observability run-finish --service broker-accumulation-tracker --status "$FABRIC_JOB_STATUS" --require
