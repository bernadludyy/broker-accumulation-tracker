name: Daily Broker Update

on:
  schedule:
    - cron: "15 18 * * 1-5"
      timezone: "Asia/Jakarta"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: broker-bot-db
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      PROJECT_FABRIC_CACHE_NAMESPACE: shared-v1
      ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PATH: broker_tracker.db
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: pip install -r requirements_github.txt

      - name: Project Fabric preflight
        run: python -m project_fabric.selfcheck

      - name: Shared cache backend status
        run: python -m project_fabric.db_admin status

      - name: Restore Project Fabric cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/project_fabric/cache
          key: fabric-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            fabric-cache-${{ github.ref_name }}-

      - name: Run existing daily runner
        run: python daily_runner.py

      - name: Project Fabric API usage report
        if: always()
        run: python -m project_fabric.report --github-summary

      - name: Save Project Fabric cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime/project_fabric/cache
          key: fabric-cache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Project Fabric usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-fabric-usage-${{ github.run_id }}
          path: .runtime/project_fabric/api_usage.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Flush SQLite WAL
        if: always()
        run: python checkpoint_db.py

      - name: Persist daily database changes
        if: always()
        shell: bash
        run: |
          git config user.name "broker-bot-actions"
          git config user.email "broker-bot-actions@users.noreply.github.com"

          if [ -f broker_tracker.db ]; then
            git add -f broker_tracker.db
          fi

          git add watchlist.txt telegram_watchlist.txt .last_sent_safe_end_date 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No persistent data changes."
            exit 0
          fi

          git commit -m "bot: daily broker update [skip ci]"
          git push
