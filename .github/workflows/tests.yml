name: Bot regression tests

on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements_github.txt'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements_github.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_github.txt
      - run: pip install -r requirements_github.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tracker.py entry_engine.py telegram_query_bot.py daily_runner.py bot_io.py broker_stalker.py market_combos.py broker_ytd_dispatch.py
