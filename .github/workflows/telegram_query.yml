name: Telegram Query Worker

# Keep this path latency-first: Telegram commands must not depend on blocking framework checks.

on:
  repository_dispatch:
    types: [telegram_update]

  workflow_dispatch:
    inputs:
      text:
        description: "Manual test, contoh: ADRO VALUE"
        required: true
        type: string
      chat_id:
        description: "Optional. Kosong = TELEGRAM_CHAT_ID secret."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: broker-bot-db
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      PROJECT_FABRIC_CACHE_NAMESPACE: shared-v1
      PROJECT_FABRIC_DB_REQUIRED: "true"
      ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PATH: broker_tracker.db
      ZAPI_SLEEP_SECONDS: "1.0"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: pip install -r requirements_github.txt

      - name: Process Telegram repository_dispatch
        if: github.event_name == 'repository_dispatch'
        run: python broker_ytd_dispatch.py --event-file "$GITHUB_EVENT_PATH"

      - name: Manual query test
        if: github.event_name == 'workflow_dispatch'
        env:
          MANUAL_TEXT: ${{ inputs.text }}
          MANUAL_CHAT_ID: ${{ inputs.chat_id }}
        run: |
          if [ -n "$MANUAL_CHAT_ID" ]; then
            python broker_ytd_dispatch.py --text "$MANUAL_TEXT" --chat-id "$MANUAL_CHAT_ID"
          else
            python broker_ytd_dispatch.py --text "$MANUAL_TEXT"
          fi

      - name: Flush SQLite WAL
        if: always()
        run: python checkpoint_db.py

      - name: Persist changed database / watchlist
        if: always()
        shell: bash
        run: |
          git config user.name "broker-bot-actions"
          git config user.email "broker-bot-actions@users.noreply.github.com"

          if [ -f broker_tracker.db ]; then
            git add -f broker_tracker.db
          fi

          git add watchlist.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No persistent data changes."
            exit 0
          fi

          git commit -m "bot: persist broker data [skip ci]"
          git push

      - name: Notify Telegram on workflow failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TEXT: ${{ inputs.text }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          COMMAND="Unknown command"

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            COMMAND="$(jq -r '
              .client_payload.telegram_update.message.text //
              .client_payload.telegram_update.edited_message.text //
              "Unknown command"
            ' "$GITHUB_EVENT_PATH")"
          elif [ -n "$MANUAL_TEXT" ]; then
            COMMAND="$MANUAL_TEXT"
          fi

          MESSAGE=$(printf \
          "❌ BOT ERROR\n\nStage: GitHub Actions\nCommand: %s\nStatus: FAILED\n\nRun: https://github.com/%s/actions/runs/%s" \
          "$COMMAND" \
          "$REPOSITORY" \
          "$RUN_ID")

          curl --fail-with-body -sS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
