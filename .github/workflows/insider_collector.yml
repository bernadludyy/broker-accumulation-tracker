name: BOT1 Insider Disclosure Collector

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/insider_collector.yml"
  schedule:
    # 11:30, 16:30, 20:30 WIB on weekdays. Disclosure-based, not live market data.
    - cron: "30 4,9,13 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Optional ticker for targeted backfill, e.g. BBRI"
        required: false
        type: string
      pages:
        description: "Global announcement pages (1-5)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: bot1-insider-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_FABRIC_DATABASE_URL: ${{ secrets.PROJECT_FABRIC_DATABASE_URL }}
      PROJECT_FABRIC_CACHE_NAMESPACE: shared-v1
      PROJECT_FABRIC_DB_REQUIRED: "true"
      ZPI_API_KEY: ${{ secrets.ZPI_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_github.txt

      - run: pip install -r requirements_github.txt

      - name: Validate required secrets
        run: |
          test -n "$PROJECT_FABRIC_DATABASE_URL" || { echo "Missing Neon DB secret"; exit 1; }
          test -n "$ZPI_API_KEY" || { echo "Missing ZAPI key"; exit 1; }

      - name: Collect disclosure cache
        env:
          INPUT_TICKER: ${{ inputs.ticker }}
          INPUT_PAGES: ${{ inputs.pages }}
        run: |
          if [ -n "$INPUT_TICKER" ]; then
            python -m scripts.insider_collect --ticker "$INPUT_TICKER"
          else
            python -m scripts.insider_collect --pages "${INPUT_PAGES:-1}"
          fi

      - name: One-time end-to-end Telegram smoke
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DB_PATH: broker_tracker.db
        run: python broker_ytd_dispatch.py --text "INSIDER REFRESH BBRI"
