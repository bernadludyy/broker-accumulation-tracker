name: Project Fabric CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-fabric-ci
  cancel-in-progress: true

jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: fabric
          POSTGRES_DB: fabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabric -d fabric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECT_FABRIC_DATABASE_URL: postgresql://fabric:fabric@localhost:5432/fabric_test
      PROJECT_FABRIC_CACHE_NAMESPACE: phase3-ci-${{ github.run_id }}
      PROJECT_FABRIC_DB_REQUIRED: "true"
      PROJECT_FABRIC_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_github.txt
      - name: Install repository dependencies
        run: pip install -r requirements_github.txt
      - name: Compile repository
        run: python -m compileall -q project_fabric tracker.py entry_engine.py telegram_query_bot.py daily_runner.py bot_io.py
      - name: Framework self-check
        run: python -m project_fabric.selfcheck
      - name: Shared database migration check
        run: python -m project_fabric.db_admin migrate --require
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
