name: Project Fabric CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-fabric-ci
  cancel-in-progress: true

jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_github.txt
      - name: Install repository dependencies
        run: pip install -r requirements_github.txt
      - name: Compile repository
        run: python -m compileall -q project_fabric tracker.py entry_engine.py telegram_query_bot.py daily_runner.py bot_io.py
      - name: Framework self-check
        run: python -m project_fabric.selfcheck
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
